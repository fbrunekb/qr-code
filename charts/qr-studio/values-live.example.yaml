# Copy to values-live.yaml and replace registry, release tag, domain and TLS secret.
image:
  repository: registry.example.com/qr-studio
  tag: "1.0.0"

# For private registries, create the Secret separately in the release namespace.
# imagePullSecrets:
#   - name: registry-credentials

ingress:
  enabled: true
  # Set to the IngressClass installed in your cluster.
  className: nginx
  annotations: {}
  # Optional, when cert-manager and this ClusterIssuer already exist:
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: qr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: qr-studio-tls
      hosts:
        - qr.example.com
